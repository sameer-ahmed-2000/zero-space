name: Enterprise Delivery Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Enforce that only one workflow runs per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # PHASE 1: CONTINUOUS INTEGRATION (Parallel Checks)
  # ------------------------------------------------------------------
  
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fails if critical vulnerabilities are found
      - name: Audit Dependencies
        run: npm audit --audit-level=critical

  quality:
    name: 💎 Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      
      # Run Lint and Type Check in parallel steps
      - name: Lint Code
        run: npm run lint
      
      - name: TypeScript Check
        run: npm run type-check

      - name: 🧪 Unit Tests
        run: npm run test

  build:
    name: 🏗️ Build Artifact
    runs-on: ubuntu-latest
    needs: [security, quality] # Only build if checks pass
    outputs:
      # Export version for CD steps
      version: ${{ steps.package-version.outputs.current-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      
      - name: Build Application
        run: npm run build
        env:
          CI: true
          
      # In corporate environments, we "Upload" the build so Deploy jobs use the EXACT same files
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: .next
          retention-days: 1

  # ------------------------------------------------------------------
  # PHASE 2: CONTINUOUS DEPLOYMENT
  # ------------------------------------------------------------------

  deploy-staging:
    name: 🚧 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' # PRs go to Staging/Preview
    environment:
      name: staging
      url: https://staging.zero-space.com
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: .next
      
      - name: Simulate Staging Deployment
        run: |
          echo "Deploying Build to Staging Environment..."
          # Vercel/AWS commands go here

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # Only Main goes to Prod
    environment:
      name: production
      url: https://zero-space.com
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: .next
          
      - name: Simulate Production Deployment
        run: |
          echo "🚀 Starting Production Deployment..."
          echo "✅ Integrity Check Passed"
          echo "🌍 Swapping URL to Live..."
