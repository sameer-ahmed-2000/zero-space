name: Production CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Linting
      run: npm run lint

    - name: Type Checking
      run: npm run type-check

  build:
    name: Production Build Verify
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Application
      run: npm run build
      env:
        # Treat warnings as errors in production often, but Next.js defaults are usually sane
        CI: true

    # Optional: Upload build artifacts if needed for CD
    # - name: Upload Build Artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: .next
    #     path: .next
